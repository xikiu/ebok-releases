name: Feature request
description: Suggest an improvement to the reading experience.
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the reading or library task you want to make easier.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your suggested solution
      description: Explain how you would expect it to work. Screenshots or examples are welcome.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform (if relevant)
      placeholder: macOS, Windows, or Linux
